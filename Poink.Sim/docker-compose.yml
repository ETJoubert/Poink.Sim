# Simple local build-and-run loop for Poink.Sim: `docker compose up --build` builds the
# database and the app together, so this file alone is enough to run Poink.Sim -- it
# doesn't replace your normal local dev/debug loop, just gives a quick sanity check of
# the real published build.
services:
  postgres:
    # TimescaleDB is a Postgres extension bundled into a Postgres image (same PGDATA
    # layout, same wire protocol). Poink.Sim's tick ingest creates the extension and
    # hypertables itself on first use (see Services/MarketData/TickIngest.cs).
    image: timescale/timescaledb:2.23.0-pg18
    container_name: poink-sim-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - poink-sim-postgres-data:/var/lib/postgresql
    command: postgres -c shared_preload_libraries=timescaledb

  poink-sim:
    build:
      context: ..
      dockerfile: Poink.Sim/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: poink-sim
    depends_on:
      - postgres
    ports:
      # Deliberately not 5001 (appsettings.json's CTrader:RedirectUri) -- keeps this
      # container running alongside a local `dotnet run` without a port clash. cTrader
      # login needs its own redirect URI registered for http://localhost:5000/... to work
      # from here.
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PoinkSim: "Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=Poink.Sim"
      ConnectionStrings__PoinkSimMaintenance: "Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=postgres"
      ConnectionStrings__PoinkMarketData: "Host=postgres;Port=5432;Username=postgres;Password=postgres;Database=Poink.MarketData"
      # appsettings.json's default (port 5001) is for local `dotnet run`. Login from this
      # container needs its own redirect URI registered with cTrader for port 5000.
      CTrader__RedirectUri: "http://localhost:5000/ctrader/callback"
    # Uncomment to enable cTrader login from inside the container -- optional; mounted
    # read-only from the host rather than baked into the image, so it never ends up in a
    # layer or gets committed.
    # volumes:
    #   - ../appsettings.Secrets.json:/app/appsettings.Secrets.json:ro

volumes:
  poink-sim-postgres-data:
