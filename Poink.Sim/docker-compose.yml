services:
  redis:
    image: redis:7
    container_name: poink-sim-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - D:\data\poink-sim-redis:/data
    # proto-max-bulk-len raised from Redis's 512MB default -- each cached tick
    # range is stored as a single JSON string value, and a wide date range or
    # busy symbol can exceed 512MB (see CachedTickRepository/RedisTickCache).
    command: redis-server --save 60 1 --loglevel warning --requirepass poinksim --proto-max-bulk-len 2gb
